name: Build audited MLJ Overleaf package

on:
  push:
    branches:
      - manuscript/machine-learning-conversion
    paths:
      - .github/workflows/build-overleaf-package.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout conversion branch
        uses: actions/checkout@v4
        with:
          ref: manuscript/machine-learning-conversion

      - name: Construct flat Overleaf package
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import shutil, re

          src = Path('manuscript/machine_learning')
          out = Path('dist/FALI_Machine_Learning_Overleaf_Ready')
          if out.exists():
              shutil.rmtree(out)
          out.mkdir(parents=True)

          text_files = [
              'main.tex', 'introduction.tex', 'related_work.tex',
              'problem_formulation.tex', 'fali_method.tex',
              'method_validation.tex', 'gpt2_ioi.tex',
              'ablation_and_gauge.tex', 'pythia_induction.tex',
              'discussion.tex', 'limitations.tex', 'conclusion.tex',
              'references.bib', 'sn-jnl.cls', 'sn-apacite.bst',
              'FALI_Machine_Learning_Supplementary_Information.tex',
              'FALI_MLJ_Contribution_Information_Sheet.tex',
          ]
          for name in text_files:
              shutil.copy2(src / name, out / name)

          for n in range(1, 6):
              shutil.copy2(src / 'figures' / f'fig{n}.tex', out / f'fig{n}.tex')
              shutil.copy2(src / 'figures' / f'Fig{n}.pdf', out / f'Fig{n}.pdf')

          # Flatten all source references: Springer explicitly warns against subfolders.
          for name in ['problem_formulation.tex', 'fali_method.tex', 'method_validation.tex', 'gpt2_ioi.tex', 'pythia_induction.tex']:
              p = out / name
              s = p.read_text()
              s = re.sub(r'\\input\{figures/(fig[1-5])\}', r'\\input{\1}', s)
              p.write_text(s)
          for n in range(1, 6):
              p = out / f'fig{n}.tex'
              s = p.read_text().replace(f'figures/Fig{n}.pdf', f'Fig{n}.pdf')
              p.write_text(s)

          # Journal title-page address requirements: include state where applicable.
          p = out / 'main.tex'
          s = p.read_text()
          s = s.replace('\\city{Weatherford}, \\country{USA}', '\\city{Weatherford}, \\state{Oklahoma}, \\country{USA}')
          s = s.replace('\\city{Stillwater}, \\country{USA}', '\\city{Stillwater}, \\state{Oklahoma}, \\country{USA}')

          # Specific in-text citation/caption for the supplementary file as Online Resource 1.
          if 'Online Resource 1' not in s:
              marker = '\\section*{Acknowledgements}'
              si_note = ('\\section*{Supplementary Information}\n'
                         'Online Resource 1: Supplementary Information containing additional details on Owen attribution, validation chronology, exact GPT-2 estimates, alternative-ablation and gauge-sensitivity analyses, and the Pythia-160M induction protocol.\n\n')
              s = s.replace(marker, si_note + marker)
          p.write_text(s)

          # Keep heading hierarchy within the journal's stated three-level maximum.
          p = out / 'limitations.tex'
          s = re.sub(r'\\paragraph\{([^}]+)\}\n', r'\\subsection{\1}\n', p.read_text())
          p.write_text(s)
          p = out / 'method_validation.tex'
          s = p.read_text().replace('\\paragraph{Use of generative AI tools.}', '\\subsection{Use of generative AI tools}')
          p.write_text(s)

          # SI metadata required by Machine Learning: title, journal, authors,
          # corresponding-author affiliation and email in every supplementary file.
          p = out / 'FALI_Machine_Learning_Supplementary_Information.tex'
          s = p.read_text()
          old = '''\\title{Supplementary Information for ``FALI: Mechanistic Decomposition of Conditional Attention-Head Causal Usefulness''}
\\author*{Ronith Sharmila, Delen Dursun, Rupesh Agrawal}
\\affil*{\\orgname{Corresponding manuscript}, \\orgaddress{\\country{USA}}}'''
          new = '''\\title{Supplementary Information for ``FALI: Mechanistic Decomposition of Conditional Attention-Head Causal Usefulness''}
\\author*[1]{\\fnm{Ronith} \\sur{Sharmila}}\\email{ronith.sharmila@swosu.edu}
\\affil*[1]{\\orgname{Southwestern Oklahoma State University}, \\orgaddress{\\city{Weatherford}, \\state{Oklahoma}, \\country{USA}}}
\\author[2]{\\fnm{Delen} \\sur{Dursun}}
\\affil[2]{\\orgname{Oklahoma State University}, \\orgaddress{\\city{Stillwater}, \\state{Oklahoma}, \\country{USA}}}
\\author[3]{\\fnm{Rupesh} \\sur{Agrawal}}
\\affil[3]{\\orgname{Northern Kentucky University}, \\orgaddress{\\city{Highland Heights}, \\state{Kentucky}, \\country{USA}}}'''
          if old not in s:
              raise RuntimeError('Expected SI front matter not found; refusing silent rewrite')
          s = s.replace(old, new)
          s = s.replace('\\maketitle\n', '\\maketitle\n\\noindent\\textbf{Journal:} Machine Learning\\par\n\\medskip\n', 1)
          p.write_text(s)

          readme = '''FALI — Machine Learning (Springer) — Overleaf-ready source package

Scientific source: manuscript/machine-learning-conversion
Input HEAD requested by research lead: 7749367a17455a8a18725680f161cf63d3972dd4

UPLOAD TO OVERLEAF
1. Create New Project -> Upload Project.
2. Upload FALI_Machine_Learning_Overleaf_Ready.zip.
3. Set compiler to pdfLaTeX.
4. Set main document to main.tex.
5. Compile.

Separate documents in the same project:
- FALI_Machine_Learning_Supplementary_Information.tex
- FALI_MLJ_Contribution_Information_Sheet.tex

Package properties:
- all files are flat (no subfolders)
- Springer Nature sn-jnl.cls included
- APA-compatible sn-apacite.bst included
- five main figures included as vector PDF files
- figure captions remain in LaTeX, outside the artwork
- SI metadata includes journal, authors, corresponding affiliation and email
- main text cites the SI as Online Resource 1

Author-supplied items still to add when available before journal submission:
- ORCID IDs (optional under the journal guideline: if available)
- a persistent public data/code URL or DOI in the Data and Code Availability statement

No new experiments or substantive scientific claims were introduced in package construction.
'''
          (out / 'README.txt').write_text(readme)
          PY

      - name: Install TeX dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-science texlive-bibtex-extra latexmk poppler-utils zip

      - name: Compile and audit all documents
        shell: bash
        run: |
          set -euo pipefail
          cd dist/FALI_Machine_Learning_Overleaf_Ready
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error FALI_Machine_Learning_Supplementary_Information.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error FALI_MLJ_Contribution_Information_Sheet.tex

          test "$(pdfinfo main.pdf | awk '/^Pages:/ {print $2}')" -ge 1
          test "$(pdfinfo FALI_Machine_Learning_Supplementary_Information.pdf | awk '/^Pages:/ {print $2}')" -ge 1
          test "$(pdfinfo FALI_MLJ_Contribution_Information_Sheet.pdf | awk '/^Pages:/ {print $2}')" -ge 1

          ! grep -E 'LaTeX Warning:.*undefined|Citation .* undefined|Reference .* undefined' main.log
          ! grep -E 'LaTeX Warning:.*undefined|Citation .* undefined|Reference .* undefined' FALI_Machine_Learning_Supplementary_Information.log
          ! grep -E 'Overfull \\hbox|Overfull \\vbox' main.log

          grep -q 'Online Resource 1' main.tex
          grep -q 'Journal:} Machine Learning' FALI_Machine_Learning_Supplementary_Information.tex
          for n in 1 2 3 4 5; do test -s "Fig${n}.pdf"; done

          printf 'MAIN_PAGES=' > BUILD_AUDIT.txt
          pdfinfo main.pdf | awk '/^Pages:/ {print $2}' >> BUILD_AUDIT.txt
          printf 'SI_PAGES=' >> BUILD_AUDIT.txt
          pdfinfo FALI_Machine_Learning_Supplementary_Information.pdf | awk '/^Pages:/ {print $2}' >> BUILD_AUDIT.txt
          printf 'CIS_PAGES=' >> BUILD_AUDIT.txt
          pdfinfo FALI_MLJ_Contribution_Information_Sheet.pdf | awk '/^Pages:/ {print $2}' >> BUILD_AUDIT.txt
          echo 'UNRESOLVED_REFS_CITES=0' >> BUILD_AUDIT.txt
          echo 'MAIN_OVERFULL_BOXES=0' >> BUILD_AUDIT.txt
          echo 'FIGURES_PRESENT=5' >> BUILD_AUDIT.txt

      - name: Build Overleaf ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist/FALI_Machine_Learning_Overleaf_Ready
          rm -f *.aux *.bbl *.blg *.fdb_latexmk *.fls *.log *.out *.toc *.synctex.gz
          rm -f main.pdf FALI_Machine_Learning_Supplementary_Information.pdf FALI_MLJ_Contribution_Information_Sheet.pdf
          zip -9 -q ../FALI_Machine_Learning_Overleaf_Ready.zip *

      - name: Upload audited package
        uses: actions/upload-artifact@v4
        with:
          name: FALI_Machine_Learning_Overleaf_Ready
          path: |
            dist/FALI_Machine_Learning_Overleaf_Ready.zip
            dist/FALI_Machine_Learning_Overleaf_Ready/BUILD_AUDIT.txt
          if-no-files-found: error
          retention-days: 7
